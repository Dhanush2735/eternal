# Memory ceiling that survives the sandbox (2026-10-24, cycle 2).
# Without this the Gradle daemon is OOM-killed on this 2 GB box and every gate reports
# "BUILD FAILED - 0 classes", which looks like a code error and is not one.
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=500m -XX:+UseSerialGC
org.gradle.daemon=false
