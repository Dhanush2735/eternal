modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/eternalengine/eternalengine/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
updateJSONURL = ""
displayURL = "https://github.com/eternalengine/eternalengine"
logoFile = "logo.png"
credits = "Build The Earth, Terra++ Team"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Forge dependency - mandatory
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

# Minecraft dependency - mandatory
[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Terra++ dependency - MANDATORY
# Fix: accept the alpha version you actually have installed
[[dependencies.${mod_id}]]
modId = "terraplusplus"
mandatory = true
versionRange = "[2.0.0-alpha,)"
ordering = "AFTER"
side = "BOTH"

# MCA Reborn - optional
[[dependencies.${mod_id}]]
modId = "mca"
mandatory = false
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"

# MineColonies - optional
[[dependencies.${mod_id}]]
modId = "minecolonies"
mandatory = false
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"

# Create - optional
[[dependencies.${mod_id}]]
modId = "create"
mandatory = false
versionRange = "[0.5,)"
ordering = "AFTER"
side = "BOTH"

# Serene Seasons - optional
[[dependencies.${mod_id}]]
modId = "sereneseasons"
mandatory = false
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"

# GameStages - optional
[[dependencies.${mod_id}]]
modId = "gamestages"
mandatory = false
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"

# JourneyMap - optional
[[dependencies.${mod_id}]]
modId = "journeymap"
mandatory = false
versionRange = "[5.9,)"
ordering = "AFTER"
side = "CLIENT"

# Xaero's Minimap - optional
[[dependencies.${mod_id}]]
modId = "xaerominimap"
mandatory = false
versionRange = "[1.0,)"
ordering = "AFTER"
side = "CLIENT"